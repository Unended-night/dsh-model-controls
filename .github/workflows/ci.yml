name: Test and package plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm pack ./plugins/dsh-model-controls --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-node-${{ matrix.node }}
          path: |
            dsh-model-controls-*.tgz
            verification/results/settings-ui/

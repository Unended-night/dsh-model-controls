# Override the entry already registered by the plugin bundle.
# Merge this section into the existing profile; do not register a second instance.
- id: model-controls
  config:
    enabled: true
    providerHeaders:
      example-provider: # Replace with an EXISTING Harness provider ID.
        headerMode: native
        customUserAgent: custom-client/1.0
    recoveryMode: retry
    maxRetries: 5
    retryDelaySeconds: 2
    retryForever: false
    maxAutoContinues: 3
    continueDelaySeconds: 2
    continueMessage: 请继续完成。
